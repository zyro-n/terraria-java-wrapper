name: Build Terraria Java Wrapper

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Compile
        run: |
          mkdir -p build/classes
          javac -d build/classes src/Main.java

      - name: Create JAR
        run: |
          mkdir -p build/libs
          jar cfe build/libs/server.jar Main -C build/classes .

      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: terraria-java-wrapper
          path: build/libs/server.jar
